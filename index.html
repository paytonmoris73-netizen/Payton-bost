<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CRUNCH — Create, cook and share food</title>
    <meta name="description" content="CRUNCH is a food creation platform: combine ingredients, generate recipes with an AI chef, and buy or sell original recipes." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CRUNCH" />
    <meta property="og:title" content="CRUNCH — Create, cook and share food" />
    <meta property="og:description" content="Combine ingredients, cook with an AI chef, and buy or sell original recipes." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CRUNCH — Create, cook and share food" />
    <meta name="twitter:description" content="Combine ingredients, cook with an AI chef, and buy or sell original recipes." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#FCEFE2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CRUNCH" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <script>
      /* Apply saved light/dark mode + theme before first paint (no flash). Mirrors src/theme.tsx. */
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("crunch-appearance") || "{}"), m = s.mode || "auto", t = s.theme || "seasonal", r = document.documentElement;
          if (m === "dark" || (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) r.classList.add("dark");
          if (t === "seasonal") { var mo = new Date().getMonth(); t = mo === 9 ? "halloween" : mo === 11 ? "christmas" : "classic"; }
          if (t !== "classic") r.setAttribute("data-crunch-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="font-family:system-ui;padding:2rem;text-align:center">CRUNCH needs JavaScript to run. Please enable it and reload.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

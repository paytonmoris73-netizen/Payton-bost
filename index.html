<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CRUNCH — Create, cook and share food</title>
    <meta name="description" content="CRUNCH is a food creation platform: combine ingredients, generate recipes with an AI chef, and buy or sell original recipes." />
    <meta name="theme-color" content="#FBF5EA" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CRUNCH" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <script>
      /* Apply saved light/dark mode + theme before first paint (no flash). Mirrors src/theme.tsx. */
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("crunch-appearance") || "{}"), m = s.mode || "auto", t = s.theme || "seasonal", r = document.documentElement;
          if (m === "dark" || (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) r.classList.add("dark");
          if (t === "seasonal") { var mo = new Date().getMonth(); t = mo === 9 ? "halloween" : mo === 11 ? "christmas" : "classic"; }
          if (t !== "classic") r.setAttribute("data-crunch-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2325231F'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' font-family='Georgia' fill='%23F2A66B'%3EC%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

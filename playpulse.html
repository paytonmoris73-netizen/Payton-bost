<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlayPulse</title>
<style>
:root {
  --bg:      #0a0a0a;
  --bg2:     #141414;
  --bg3:     #1e1e1e;
  --border:  #262626;
  --text:    #ffffff;
  --muted:   #777;
  --fire:    #ff4b2b;
  --fire2:   #ff7043;
  --gold:    #fbbf24;
  --green:   #22c55e;
  --purple:  #a855f7;
  --radius:  16px;
  --rsm:     10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;position:relative;overflow:hidden}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
.logo{font-size:21px;font-weight:900;letter-spacing:-0.5px;background:linear-gradient(135deg,#ff4b2b,#ff9a44);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.topbar-stats{display:flex;align-items:center;gap:10px}
.stat-chip{display:flex;align-items:center;gap:3px;font-size:14px;font-weight:800;cursor:default}
.stat-chip .ico{font-size:16px;line-height:1}
#streak-val{color:#ff7043}
#pp-val{color:#a855f7}
#energy-val{color:#fbbf24}

/* ── BOTTOM NAV ── */
.bnav{display:flex;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;border:none;background:none;color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;letter-spacing:0.3px;transition:color .15s}
.nbtn .ni{font-size:22px;line-height:1;transition:transform .15s}
.nbtn.on{color:var(--fire)}
.nbtn.on .ni{transform:scale(1.12)}

/* ── SCREENS ── */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;display:none}
.screen.on{display:block}
.screen::-webkit-scrollbar{width:0}

/* ── TRAIN SCREEN ── */
#s-train{padding-bottom:24px}
.zone-wrap{margin-bottom:4px}
.zone-hdr{display:flex;align-items:center;gap:12px;padding:18px 16px 10px}
.zone-badge{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.zone-info{flex:1;min-width:0}
.zone-name{font-size:17px;font-weight:800;line-height:1.1}
.zone-sub{font-size:12px;color:var(--muted);margin-top:2px}
.zone-bar-track{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.zone-bar-fill{height:100%;border-radius:2px;transition:width .5s ease}
.zone-count{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}

.mpath{padding:0 16px;display:flex;flex-direction:column;align-items:stretch;gap:0}
.mrow{display:flex;align-items:center;position:relative;padding:6px 0}
.mrow.left{justify-content:flex-start;padding-left:36px}
.mrow.right{justify-content:flex-end;padding-right:36px}

.mnode{width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;border:3px solid transparent;transition:transform .12s;flex-shrink:0}
.mnode:active{transform:scale(.92)}
.mnode .mico{font-size:28px;line-height:1}
.mnode .mlbl{font-size:9px;font-weight:800;color:rgba(255,255,255,.75);text-align:center;margin-top:2px;max-width:68px;line-height:1.1;letter-spacing:.2px}

.mnode.locked{background:var(--bg3);border-color:var(--border);opacity:.45;cursor:default}
.mnode.avail{border-color:var(--fire);background:linear-gradient(135deg,rgba(255,75,43,.15),rgba(255,154,68,.08));animation:pulse-m 2.2s ease-in-out infinite}
@keyframes pulse-m{0%,100%{box-shadow:0 0 16px rgba(255,75,43,.35)}50%{box-shadow:0 0 32px rgba(255,75,43,.65);transform:scale(1.04)}}
.mnode.avail:active{animation:none;transform:scale(.92)}
.mnode.done{border-color:var(--green);background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(34,197,94,.06));box-shadow:0 0 10px rgba(34,197,94,.2)}
.cbadge{position:absolute;top:-3px;right:-3px;width:22px;height:22px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#000;border:2px solid var(--bg)}
.mnode.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ── DAILY SCREEN ── */
#s-daily{padding:16px}
.daily-hero{background:linear-gradient(135deg,#ff4b2b,#ff7c54);border-radius:var(--radius);padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.daily-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:rgba(255,255,255,.08);border-radius:50%}
.daily-label{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:.85;margin-bottom:6px}
.daily-title{font-size:22px;font-weight:900;margin-bottom:12px;line-height:1.1}
.mpills{display:flex;gap:8px;flex-wrap:wrap}
.mpill{background:rgba(0,0,0,.2);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700}
.sec-title{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:0 0 10px}
.exlist{display:flex;flex-direction:column;gap:7px;margin-bottom:20px}
.exrow{background:var(--bg2);border-radius:var(--rsm);padding:11px 14px;display:flex;align-items:center;gap:11px}
.exnum{width:28px;height:28px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.exinfo{flex:1}
.exname{font-size:14px;font-weight:700}
.exdetail{font-size:11px;color:var(--muted);margin-top:2px}

/* ── CREW SCREEN ── */
#s-crew{padding:16px}
.lb-item{background:var(--bg2);border-radius:var(--rsm);padding:11px 14px;display:flex;align-items:center;gap:11px;margin-bottom:7px}
.lb-item.me{background:linear-gradient(135deg,rgba(255,75,43,.12),rgba(255,154,68,.07));border:1px solid rgba(255,75,43,.3)}
.rank-n{width:34px;text-align:center;font-size:17px;font-weight:900;flex-shrink:0}
.rank-n.g1{color:var(--gold)} .rank-n.g2{color:#c0c0c0} .rank-n.g3{color:#cd7f32}
.pavatar{width:40px;height:40px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pinfo{flex:1}
.pname{font-size:14px;font-weight:700}
.plvl{font-size:11px;color:var(--muted);margin-top:1px}
.ppp{font-size:14px;font-weight:800;color:var(--purple)}

/* ── PROFILE SCREEN ── */
#s-profile{padding-bottom:24px}
.profile-hero{text-align:center;padding:24px 16px 20px}
.avwrap{display:inline-block;position:relative;margin-bottom:12px}
.avatar{width:90px;height:90px;background:linear-gradient(135deg,#ff4b2b,#ff9a44);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px}
.lvl-badge{position:absolute;bottom:0;right:0;background:var(--gold);color:#000;font-size:10px;font-weight:900;padding:3px 7px;border-radius:10px;border:2px solid var(--bg)}
.prtitle{font-size:22px;font-weight:900;margin-bottom:3px}
.prsub{font-size:13px;color:var(--muted);margin-bottom:16px}
.pp-prog-wrap{max-width:220px;margin:0 auto}
.pp-prog-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:600}
.pp-track{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.pp-fill{height:100%;background:linear-gradient(90deg,var(--purple),#c084fc);border-radius:4px;transition:width .5s ease}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px;margin-bottom:20px}
.scard{background:var(--bg2);border-radius:var(--rsm);padding:14px;text-align:center}
.scard .sv{font-size:28px;font-weight:900;line-height:1;margin-bottom:4px}
.scard .sl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 16px}
.achieve{background:var(--bg2);border-radius:var(--rsm);padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.achieve.off{opacity:.35;filter:grayscale(1)}
.achieve .aico{font-size:24px}
.achieve .anm{font-size:9px;font-weight:700;color:var(--muted);line-height:1.2}

/* ── BUTTONS ── */
.btn-fire{width:100%;padding:15px;background:linear-gradient(135deg,var(--fire),var(--fire2));border:none;border-radius:var(--radius);color:#fff;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.3px;transition:opacity .15s,transform .1s;box-shadow:0 4px 20px rgba(255,75,43,.35)}
.btn-fire:active{transform:scale(.97)}
.btn-fire:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-ghost{width:100%;margin-top:8px;padding:12px;background:none;border:1px solid var(--border);border-radius:var(--radius);color:var(--muted);font-size:14px;cursor:pointer}
.btn-ghost:active{opacity:.7}

/* ── MODALS ── */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:flex-end}
.moverlay.on{display:flex}
.msheet{background:var(--bg2);border-radius:22px 22px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:20px 20px 32px;animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.mhandle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}

/* ── SESSION FULLSCREEN ── */
#s-sess{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column}
#s-sess.on{display:flex}
.sess-hdr{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.sess-close{width:36px;height:36px;background:var(--bg3);border:none;border-radius:50%;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sess-title{font-size:17px;font-weight:800;flex:1}
.sess-prog{font-size:13px;font-weight:700;color:var(--muted)}
.sess-body{flex:1;overflow-y:auto;padding:20px 16px}
.sess-foot{padding:14px 16px;border-top:1px solid var(--border);flex-shrink:0}

.cur-ex{text-align:center;margin-bottom:22px}
.exbig{font-size:72px;display:block;margin-bottom:12px}
.exbig-name{font-size:26px;font-weight:900;margin-bottom:6px}
.exbig-hint{font-size:13px;color:var(--muted);max-width:260px;margin:0 auto 20px}
.set-dots{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
.sdot{width:12px;height:12px;border-radius:50%;background:var(--border);border:2px solid var(--border);transition:background .2s,border-color .2s}
.sdot.done{background:var(--green);border-color:var(--green)}
.sdot.cur{background:var(--fire);border-color:var(--fire);animation:pdot 1s ease-in-out infinite}
@keyframes pdot{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}

.rep-row{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:4px}
.rbtn{width:56px;height:56px;border-radius:50%;border:2px solid var(--border);background:var(--bg3);color:var(--text);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s;line-height:1}
.rbtn:active{transform:scale(.88)}
.rval{font-size:58px;font-weight:900;min-width:80px;text-align:center;line-height:1}
.rep-hint{font-size:12px;color:var(--muted);text-align:center;margin-bottom:20px}

.rest-block{text-align:center;padding:28px 20px}
.rest-label{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:8px}
.rest-time{font-size:72px;font-weight:900;color:var(--fire);line-height:1}
.rest-sub{font-size:13px;color:var(--muted);margin-top:8px}
.skip-btn{margin-top:18px;padding:10px 24px;background:none;border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:13px;cursor:pointer}

/* ── COMPLETION ── */
.cmp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.cmp-overlay.on{display:flex}
.cmp-card{background:var(--bg2);border-radius:22px;padding:30px 24px;width:100%;max-width:400px;text-align:center;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.cmp-emo{font-size:72px;display:block;margin-bottom:14px}
.cmp-title{font-size:26px;font-weight:900;margin-bottom:7px}
.cmp-sub{font-size:14px;color:var(--muted);margin-bottom:22px}
.reward-row{display:flex;justify-content:center;gap:14px;margin-bottom:22px}
.rchip{background:var(--bg3);border-radius:12px;padding:12px 18px;display:flex;flex-direction:column;align-items:center;gap:4px}
.rchip .rv{font-size:24px;font-weight:900}
.rchip .rl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.rv.pp{color:var(--purple)} .rv.st{color:var(--fire2)}

/* ── MISSION MODAL ── */
.mpr-title{font-size:21px;font-weight:900;margin-bottom:3px}
.mpr-sub{font-size:13px;color:var(--muted)}
.mpr-meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px;margin-bottom:20px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="logo">PlayPulse</span>
    <div class="topbar-stats">
      <div class="stat-chip"><span class="ico">🔥</span><span id="streak-val">0</span></div>
      <div class="stat-chip"><span class="ico">⚡</span><span id="pp-val">0</span></div>
      <div class="stat-chip"><span class="ico">💛</span><span id="energy-val">5</span></div>
    </div>
  </div>

  <div id="s-train" class="screen on"></div>
  <div id="s-daily" class="screen"></div>
  <div id="s-crew"  class="screen"></div>
  <div id="s-profile" class="screen"></div>

  <nav class="bnav">
    <button class="nbtn on" data-s="train"><span class="ni">🏃</span>Train</button>
    <button class="nbtn"     data-s="daily"><span class="ni">⚡</span>Daily</button>
    <button class="nbtn"     data-s="crew" ><span class="ni">🏆</span>Crew</button>
    <button class="nbtn"     data-s="profile"><span class="ni">👤</span>Profile</button>
  </nav>
</div>

<!-- Mission preview bottom sheet -->
<div id="mm" class="moverlay">
  <div class="msheet"><div class="mhandle"></div><div id="mm-body"></div></div>
</div>

<!-- Full-screen workout session -->
<div id="s-sess">
  <div class="sess-hdr">
    <button class="sess-close" id="sess-x">✕</button>
    <span class="sess-title" id="sess-title">Workout</span>
    <span class="sess-prog" id="sess-prog">0/0</span>
  </div>
  <div class="sess-body" id="sess-body"></div>
  <div class="sess-foot"><button class="btn-fire" id="sess-next">Next</button></div>
</div>

<!-- Completion celebration -->
<div id="cmp" class="cmp-overlay">
  <div class="cmp-card" id="cmp-card"></div>
</div>

// ═══════════════════════
//  STATE
// ═══════════════════════
function ppForLevel(lvl) { return 100 * lvl * (lvl + 1) / 2; }

function levelFromPP(pp) {
  let l = 1;
  while (ppForLevel(l) <= pp && l < 50) l++;
  return l;
}
function ppInLevel(pp) {
  const l = levelFromPP(pp);
  return pp - (l > 1 ? ppForLevel(l - 1) : 0);
}
function ppPerLevel(pp) {
  const l = levelFromPP(pp);
  return ppForLevel(l) - (l > 1 ? ppForLevel(l - 1) : 0);
}

function loadState() {
  try {
    const s = localStorage.getItem("pp_v3");
    if (s) return JSON.parse(s);
  } catch(_) {}
  return { name:"Champion", totalPP:0, streak:0, longest:0, lastDay:null, energy:5, lastRegen:Date.now(), done:[], dailyDate:null, ach:[] };
}
function save() { localStorage.setItem("pp_v3", JSON.stringify(S)); }

let S = loadState();

function regenEnergy() {
  const hrs = (Date.now() - S.lastRegen) / 3600000;
  const add = Math.floor(hrs);
  if (add > 0) {
    S.energy = Math.min(5, S.energy + add);
    S.lastRegen = Date.now() - ((hrs - add) * 3600000);
    save();
  }
}
regenEnergy();

function missionState(mid) {
  if (S.done.includes(mid)) return "done";
  for (let zi = 0; zi < ZONES.length; zi++) {
    const z = ZONES[zi];
    const mi = z.missions.findIndex(m => m.id === mid);
    if (mi === -1) continue;
    if (mi === 0) {
      if (zi === 0) return "avail";
      const pz = ZONES[zi - 1];
      const pDone = pz.missions.filter(m => S.done.includes(m.id)).length;
      return pDone >= Math.ceil(pz.missions.length / 2) ? "avail" : "locked";
    }
    return S.done.includes(z.missions[mi - 1].id) ? "avail" : "locked";
  }
  return "locked";
}

function renderTrain() {
  const el = document.getElementById("s-train");
  let html = "";
  ZONES.forEach(z => {
    const done = z.missions.filter(m => S.done.includes(m.id)).length;
    const pct = Math.round(done / z.missions.length * 100);
    html += `<div class="zone-wrap">
      <div class="zone-hdr">
        <div class="zone-badge" style="background:${z.color}22">${z.icon}</div>
        <div class="zone-info">
          <div class="zone-name">${z.name}</div>
          <div class="zone-sub">${z.sub}</div>
          <div class="zone-bar-track"><div class="zone-bar-fill" style="width:${pct}%;background:${z.color}"></div></div>
        </div>
        <div class="zone-count">${done}/${z.missions.length}</div>
      </div>
      <div class="mpath">`;
    z.missions.forEach((m, i) => {
      const st = missionState(m.id);
      const side = i % 2 === 0 ? "left" : "right";
      html += `<div class="mrow ${side}">
        <div class="mnode ${st}" data-mid="${m.id}" onclick="clickM(${m.id})">
          <span class="mico">${m.icon}</span>
          <span class="mlbl">${m.name}</span>
          ${st === "done" ? '<span class="cbadge">✓</span>' : ""}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  el.innerHTML = html;
}

// ═══════════════════════
//  MISSION CLICK
// ═══════════════════════
function clickM(mid) {
  const st = missionState(mid);
  if (st === "locked") {
    const node = document.querySelector(`[data-mid="${mid}"]`);
    if (node) { node.classList.remove("shake"); void node.offsetWidth; node.classList.add("shake"); }
    return;
  }
  let mission;
  for (const z of ZONES) { mission = z.missions.find(m => m.id === mid); if (mission) break; }
  if (mission) showMM(mission);
}

// ═══════════════════════
//  MISSION MODAL
// ═══════════════════════
function showMM(mission) {
  const isDone = S.done.includes(mission.id);
  const exHtml = mission.exercises.map(ex => `
    <div class="exrow">
      <div class="exnum">${ex.ico}</div>
      <div class="exinfo">
        <div class="exname">${ex.n}</div>
        <div class="exdetail">${ex.sets} sets × ${ex.reps ? ex.reps+" reps" : ex.dur+"s"}</div>
      </div>
    </div>`).join("");
  document.getElementById("mm-body").innerHTML = `
    <div style="text-align:center;margin-bottom:18px">
      <span style="font-size:52px;display:block;margin-bottom:10px">${mission.icon}</span>
      <div class="mpr-title">${mission.name}</div>
      <div class="mpr-sub">${mission.type} · ${mission.exercises.length} exercises</div>
      <div class="mpr-meta">
        <span class="mpill" style="background:var(--bg3)">⚡ +${mission.pp} PP</span>
        ${isDone ? '<span class="mpill" style="background:rgba(34,197,94,.12);color:var(--green)">✓ Done</span>' : ""}
      </div>
    </div>
    <div class="sec-title">Exercises</div>
    <div class="exlist" style="margin-bottom:20px">${exHtml}</div>
    <button class="btn-fire" onclick="startSess(${mission.id},false)">${isDone?"🔄 Replay":"▶ Start Mission"}</button>
    <button class="btn-ghost" onclick="closeM()">Cancel</button>`;
  document.getElementById("mm").classList.add("on");
  document.getElementById("mm").onclick = e => { if (e.target === document.getElementById("mm")) closeM(); };
}
function closeM() { document.getElementById("mm").classList.remove("on"); }

// ═══════════════════════
//  SESSION
// ═══════════════════════
let SS = null;
let timer = null;

function startSess(mid, isDaily) {
  closeM();
  let exercises, title, pp;
  if (isDaily) {
    exercises = DAILY.exercises; title = DAILY.name; pp = DAILY.pp;
  } else {
    let m; for (const z of ZONES) { m = z.missions.find(x=>x.id===mid); if(m) break; }
    if (!m) return;
    exercises = m.exercises; title = m.name; pp = m.pp;
  }
  SS = { mid, isDaily, exercises, title, pp, ei:0, si:0, reps:0, phase:"ex" };
  document.getElementById("sess-title").textContent = title;
  document.getElementById("s-sess").classList.add("on");
  renderSessEx();
}

function renderSessEx() {
  if (!SS) return;
  if (SS.ei >= SS.exercises.length) { finishSess(); return; }
  const ex = SS.exercises[SS.ei];
  document.getElementById("sess-prog").textContent = `${SS.ei+1}/${SS.exercises.length}`;
  const dots = Array.from({length:ex.sets},(_,i)=>
    `<div class="sdot ${i<SS.si?"done":i===SS.si?"cur":""}"></div>`).join("");
  if (ex.dur) {
    document.getElementById("sess-body").innerHTML = `
      <div class="cur-ex">
        <span class="exbig">${ex.ico}</span>
        <div class="exbig-name">${ex.n}</div>
        <div class="exbig-hint">${ex.hint}</div>
      </div>
      <div class="set-dots">${dots}</div>
      <div class="rest-block">
        <div class="rest-label">SET ${SS.si+1} OF ${ex.sets}</div>
        <div class="rest-time" id="ex-time">${ex.dur}</div>
        <div class="rest-sub">seconds</div>
      </div>`;
    document.getElementById("sess-next").textContent = "Skip ›";
    startExTimer(ex.dur);
  } else {
    SS.reps = ex.reps;
    document.getElementById("sess-body").innerHTML = `
      <div class="cur-ex">
        <span class="exbig">${ex.ico}</span>
        <div class="exbig-name">${ex.n}</div>
        <div class="exbig-hint">${ex.hint}</div>
      </div>
      <div class="set-dots">${dots}</div>
      <div class="rep-row">
        <button class="rbtn" onclick="adjRep(-1)">−</button>
        <div class="rval" id="rep-val">${ex.reps}</div>
        <button class="rbtn" onclick="adjRep(1)">+</button>
      </div>
      <div class="rep-hint">Target: ${ex.reps} reps</div>`;
    document.getElementById("sess-next").textContent = `Log Set ${SS.si+1}`;
  }
  document.getElementById("sess-next").onclick = handleNext;
}

function startExTimer(secs) {
  clearTmr();
  let r = secs;
  timer = setInterval(()=>{
    r--;
    const el = document.getElementById("ex-time");
    if (el) el.textContent = r;
    if (r <= 0) { clearTmr(); advSet(); }
  }, 1000);
}

function startRestTimer(secs) {
  if (secs <= 0) { afterRest(); return; }
  clearTmr();
  let r = secs;
  document.getElementById("sess-body").innerHTML = `
    <div class="rest-block" style="padding-top:60px">
      <div class="rest-label">Rest</div>
      <div class="rest-time" id="rest-t">${r}</div>
      <div class="rest-sub">seconds until next set</div>
      <button class="skip-btn" onclick="skipRest()">Skip Rest</button>
    </div>`;
  document.getElementById("sess-next").textContent = "Skip Rest";
  document.getElementById("sess-next").onclick = skipRest;
  timer = setInterval(()=>{
    r--;
    const el = document.getElementById("rest-t");
    if (el) el.textContent = r;
    if (r <= 0) { clearTmr(); afterRest(); }
  }, 1000);
}

function clearTmr() { if (timer) { clearInterval(timer); timer = null; } }
function adjRep(d) { SS.reps = Math.max(0, SS.reps+d); const el = document.getElementById("rep-val"); if(el) el.textContent = SS.reps; }
function skipRest() { clearTmr(); afterRest(); }
function afterRest() { document.getElementById("sess-next").onclick = handleNext; renderSessEx(); }

function handleNext() {
  clearTmr();
  advSet();
}

function advSet() {
  if (!SS) return;
  const ex = SS.exercises[SS.ei];
  SS.si++;
  if (SS.si >= ex.sets) {
    SS.ei++; SS.si = 0;
    if (SS.ei >= SS.exercises.length) { finishSess(); return; }
    const nex = SS.exercises[SS.ei];
    startRestTimer(nex.rest || 20);
  } else {
    startRestTimer(ex.rest || 20);
  }
}

function finishSess() {
  clearTmr();
  document.getElementById("s-sess").classList.remove("on");
  const { mid, isDaily, pp } = SS;
  S.totalPP += pp;
  S.level = levelFromPP(S.totalPP);
  const today = new Date().toDateString();
  const yesterday = new Date(Date.now()-86400000).toDateString();
  if (S.lastDay === today) {
    // streak unchanged
  } else if (S.lastDay === yesterday) {
    S.streak++;
  } else {
    S.streak = S.lastDay ? 1 : 1;
  }
  S.lastDay = today;
  if (S.streak > S.longest) S.longest = S.streak;
  if (mid && !S.done.includes(mid)) S.done.push(mid);
  if (isDaily) S.dailyDate = today;
  S.energy = Math.min(5, S.energy + 1);
  checkAch();
  save();
  updateHeader();
  renderTrain(); renderDaily(); renderCrew(); renderProfile();
  showCmp(pp);
}

function checkAch() {
  const u = id => { if (!S.ach.includes(id)) S.ach.push(id); };
  if (S.done.length >= 1) u("sweat1");
  if (S.done.length >= 5) u("m5");
  if (S.streak >= 3) u("str3");
  if (S.streak >= 7) u("str7");
  if (S.level >= 5) u("lvl5");
  if (S.totalPP >= 100) u("pp100");
  if (S.totalPP >= 500) u("pp500");
  if (S.totalPP >= 1000) u("pp1000");
  const hasZ = zi => ZONES[zi].missions.some(m => S.done.includes(m.id));
  if (hasZ(1)) u("z2"); if (hasZ(2)) u("z3"); if (hasZ(3)) u("z4"); if (hasZ(4)) u("z5");
}

function showCmp(pp) {
  const msgs = ["Absolutely crushed it! 🔥","That's how it's done! 💪","Beast mode activated! 🦁","You're unstoppable! ⚡","Mission accomplished! 🎯"];
  document.getElementById("cmp-card").innerHTML = `
    <span class="cmp-emo">🎉</span>
    <div class="cmp-title">Mission Complete!</div>
    <div class="cmp-sub">${msgs[Math.floor(Math.random()*msgs.length)]}</div>
    <div class="reward-row">
      <div class="rchip"><span class="rv pp">+${pp}</span><span class="rl">Power Points</span></div>
      <div class="rchip"><span class="rv st">🔥 ${S.streak}</span><span class="rl">Burn Streak</span></div>
    </div>
    <button class="btn-fire" onclick="closeCmp()">Keep Going</button>`;
  document.getElementById("cmp").classList.add("on");
}
function closeCmp() { document.getElementById("cmp").classList.remove("on"); }

// ═══════════════════════
//  NAV
// ═══════════════════════
document.querySelectorAll(".nbtn").forEach(btn => {
  btn.addEventListener("click", () => {
    const s = btn.dataset.s;
    document.querySelectorAll(".nbtn").forEach(b => b.classList.remove("on"));
    document.querySelectorAll(".screen").forEach(el => el.classList.remove("on"));
    btn.classList.add("on");
    document.getElementById(`s-${s}`).classList.add("on");
  });
});

document.getElementById("sess-x").onclick = () => {
  if (confirm("End workout? Progress won't be saved.")) {
    clearTmr();
    document.getElementById("s-sess").classList.remove("on");
    SS = null;
  }
};

// ═══════════════════════
//  INIT
// ═══════════════════════
updateHeader();
renderTrain();
renderDaily();
renderCrew();
renderProfile();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2048 — Study Hall Arcade</title>
<link rel="stylesheet" href="../style.css" />
<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 80px);
    grid-template-rows: repeat(4, 80px);
    gap: 10px;
    justify-content: center;
    margin: 20px auto;
    background: #1e293b;
    padding: 10px;
    border-radius: 14px;
    width: fit-content;
  }
  .tile {
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.5rem;
    background: #334155;
    color: #f1f5f9;
  }
  .t2 { background:#334155; } .t4 { background:#3f4a63; }
  .t8 { background:#d97706; } .t16 { background:#ea580c; }
  .t32 { background:#dc2626; color:#fff; } .t64 { background:#be123c; color:#fff; }
  .t128 { background:#0891b2; color:#fff; } .t256 { background:#0e7490; color:#fff; }
  .t512 { background:#7c3aed; color:#fff; } .t1024 { background:#6d28d9; color:#fff; }
  .t2048 { background:#facc15; color:#1e293b; }
  @media (max-width: 380px) {
    .grid { grid-template-columns: repeat(4, 64px); grid-template-rows: repeat(4, 64px); }
    .tile { font-size: 1.2rem; }
  }
</style>
</head>
<body>
  <div class="game-wrap">
    <a class="back-link" href="../index.html">← Back to arcade</a>
    <h1>🔢 2048</h1>
    <div class="scoreboard">
      <div class="stat"><div class="num" id="score">0</div><div class="label">Score</div></div>
      <div class="stat"><div class="num" id="best">0</div><div class="label">Best</div></div>
    </div>
    <div class="grid" id="grid"></div>
    <button class="btn" id="restartBtn">New Game</button>
    <p id="msg" style="font-weight:700; min-height:1.4em; color:#34d399;"></p>
    <p style="color:#94a3b8; font-size:0.85rem;">Arrow keys or swipe to combine matching tiles.</p>
  </div>
<script>
const gridEl = document.getElementById('grid');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');
let board, score, best, over;
best = Number(localStorage.getItem('best2048') || 0);
bestEl.textContent = best;

function emptyBoard() { return Array.from({length:4}, () => Array(4).fill(0)); }

function addTile() {
  const empties = [];
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (!board[r][c]) empties.push([r,c]);
  if (!empties.length) return;
  const [r,c] = empties[Math.floor(Math.random()*empties.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
  gridEl.innerHTML = '';
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
    const v = board[r][c];
    const tile = document.createElement('div');
    tile.className = 'tile' + (v ? ' t'+v : '');
    tile.textContent = v || '';
    gridEl.appendChild(tile);
  }
  scoreEl.textContent = score;
}

function slideRowLeft(row) {
  let vals = row.filter(v => v);
  for (let i=0;i<vals.length-1;i++) {
    if (vals[i] === vals[i+1]) {
      vals[i] *= 2;
      score += vals[i];
      vals[i+1] = 0;
    }
  }
  vals = vals.filter(v => v);
  while (vals.length < 4) vals.push(0);
  return vals;
}

function rotateBoard(b) {
  const n = emptyBoard();
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) n[c][3-r] = b[r][c];
  return n;
}

function move(dir) {
  if (over) return;
  let moved = false;
  let b = board;
  let rotations = { left:0, up:1, right:2, down:3 }[dir];
  for (let i=0;i<rotations;i++) b = rotateBoard(b);

  const newBoard = b.map(row => slideRowLeft(row));
  if (JSON.stringify(newBoard) !== JSON.stringify(b)) moved = true;
  b = newBoard;

  for (let i=0;i<(4-rotations)%4;i++) b = rotateBoard(b);
  board = b;

  if (moved) {
    addTile();
    render();
    if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('best2048', best); }
    checkEnd();
  }
}

function checkEnd() {
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
    if (board[r][c] === 2048) { msgEl.textContent = '🎉 You reached 2048!'; over = true; return; }
  }
  const empties = board.flat().filter(v => !v).length;
  if (empties > 0) return;
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
    if (c<3 && board[r][c] === board[r][c+1]) return;
    if (r<3 && board[r][c] === board[r+1][c]) return;
  }
  msgEl.textContent = 'Game over — no more moves!';
  over = true;
}

document.addEventListener('keydown', e => {
  const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

let touchStart = null;
gridEl.addEventListener('touchstart', e => { touchStart = e.touches[0]; });
gridEl.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.clientX;
  const dy = e.changedTouches[0].clientY - touchStart.clientY;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
  touchStart = null;
});

function restart() {
  board = emptyBoard();
  score = 0; over = false;
  msgEl.textContent = '';
  addTile(); addTile();
  render();
}

document.getElementById('restartBtn').onclick = restart;
restart();
</script>
</body>
</html>
